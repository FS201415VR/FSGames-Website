                <a class="nb" href="games.html">Games</a>

    <dialog id="settings" class="settings-dlg" aria-labelledby="sTitle">
        <div class="bar"><h3 id="sTitle">Settings</h3><button type="button" id="closeSettings">Close</button></div>
        <div class="sbody">
            <h4>Background color</h4>
            <div class="swatches" role="group" aria-label="Background color">
                <button type="button" data-theme-set="dark" aria-pressed="false"><i style="background:#181818"></i>Dark</button>
                <button type="button" data-theme-set="black" aria-pressed="false"><i style="background:#000000"></i>Pure black</button>
                <button type="button" data-theme-set="purple" aria-pressed="false"><i style="background:#15131f"></i>Purple</button>
            </div>
        </div>
    </dialog>

    <main>
        <div class="wrap hero">
            <h1>FS Games</h1>
            <p>We Make Games</p>
            <a class="btn" href="games.html">Browse Games</a>
        </div>
    </main>

    <footer>
        <div class="wrap">
            <small>© <span id="yr">2026</span> FS Games. We make games.</small>
        </div>
    </footer>


    <script src="js/main.js"></script>
